<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags HTML</title>
</head>
<body>
    <h1>Tags em HTML</h1>
    <p>Em HTML, podemos inserir elementos da lista a seguir. Passe o mouse sobre os termos para vizualizar a tag que deve ser utilizada</p>
    <ul>
        <li title="Utilize a tag &lt;h1&gt; para o título principal">Título Principal</li>
        <li title="Utilize a tag &lt;h2&gt; para subtítulos">Subtítulo</li>
        <li title="Utilize a tag &lt;p&gt; para parágrafos">Parágrafo</li>
        <li title="Utilize a tag &lt;a&gt; para links">Link</li>
        <li title="Utilize a tag &lt;img&gt; para imagens">Imagem</li>
        <li title="Utilize a tag &lt;ul&gt; para listas não ordenadas">Lista Não Ordenada</li>
        <li title="Utilize a tag &lt;ol&gt; para listas ordenadas">Lista Ordenada</li>
        <li title="Utilize a tag &lt;table&gt; para tabelas">Tabela</li>
        
</body>
</html>
