<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixas</title>
    <style>
        h1 { /*(box-level) */
            background-color: lightcyan;
            height: 300px;
            width: 300px;
            /*
            border-width: 10px;
            border-style: solid;
            border-color: lightblue;
            */
            border: 10px solid lightblue; /* Atalho para definir borda */

            /*
            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;
            */
            padding: 10px; /* Atalho para definir padding */

            /*
            margin-top: 10px;
            margin-right: 10px;
            margin-bottom: 10px;
            margin-left: 10px;
            */
            margin: 10px; /* Atalho para definir margin */

            /*
            outline-width: 5px ;
            outline-style: dashed;
            outline-color: rgb(202, 40, 40);
            */
            outline: 5px dashed rgb(202, 40, 40); /* Atalho para definir outline */
        }

        a { /* inline-level*/
            background-color: lightyellow;
            height: 50px;
            width: 100px;
            border-width: 5px;
            border-style: solid;
            border-color: lightgreen;
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Parágrafo também são exemplos de box-level, mas os <a href="#">links são exemplos de caixas inline-level.</a> Vamos ver como tudo isso funciona. </p>
</body>
</html>
