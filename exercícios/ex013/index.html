<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estilos Inline</title>
</head>
<body style="background-color: rgb(138, 152, 156);">

    <h1 style="color: blue; text-align: center;">Bem-vindo ao meu site!</h1>
    <p style="font-size: 20px; color: green;">Este é um exemplo de uso de estilos inline em HTML.</p>
    
    <div style="border: 2px solid black; padding: 20px; margin: 20px;">
        <h2 style="color: red;">Seção Importante</h2>
        <p>Você pode aplicar estilos diretamente aos elementos HTML usando o atributo <code>style</code>.</p>
    </div>
    
</body>
</html>
