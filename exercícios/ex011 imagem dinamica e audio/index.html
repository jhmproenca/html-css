<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midias HTML</title>
</head>
<body>
    <h1>Imagens dinâmicas</h1>
    <p>Tente abrir esse site em vários dispositivos diferentes ou simplesmente aumente e diminua o tamanho do seu navegador</p>
    <picture>
        <source media="(max-width: 750px)" srcset="imagens/imagemP.png" type="image/png">
        <source media="(max-width: 1050px )" srcset="imagens/imagemM.png" type="image/png">
        <img src="imagens/imagemG.png" alt="Imagem flexivel">
    </picture>
    <h1>Reproduzindo audio</h1>
    <audio src="midia/I'm Giving Up - Everet Almond.mp3" controls></audio>
    <p>Outro jeito</p>
    <audio preload="metadata" src="midia/I'm Giving Up - Everet Almond.mp3" type="audio/mpeg" controls loop>
        Seu navegador não suporta o elemento <code>audio</code>.

    </audio>
</body>
</html>
