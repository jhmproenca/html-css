<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes externas</title>
    <style>
        @font-face {
            font-family:'Love Story';
            /* Caminho relativo ao arquivo fonte02.html */;
            src: url('fontes/love story ttf.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            /*
            tipos de format()
            'truetype' - TTF
            'opentype' - OTF
            'woff' - WOFF
            'woff2' - WOFF2
            'embedded-opentype' - EOT
            'svg' - SVG
            'truetype-collection' - TTC

            */
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        h1 {
            font-family: 'love story';
            font-size: 3em;
            font-weight: normal;
        }

    </style>
</head>
<body>
    <h1>Título</h1>
    <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Quisquam odio quia amet laudantium! Odit incidunt autem laboriosam possimus facere aut dolorem similique tempore, illo deserunt. Neque reiciendis esse fugit tenetur?</p>
    
</body>
</html>
