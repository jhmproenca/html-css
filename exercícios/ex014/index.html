<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estilos Inline</title>
    <style>
        body {
            background-color: aquamarine;
            font-family: Arial, Helvetica, sans-serif;
        }
        h1 {
            color: darkblue;
            
        }
        p {
            color: darkgreen;
            font-size: 1.2em;
        }
    </style>
</head>
<body>

    <h1 >Bem-vindo ao meu site!</h1>
    <p>Este é um exemplo de uso de estilos inline em HTML.</p>
    
    <div>
        <h2 >Seção Importante</h2>
        <p>Você pode aplicar estilos diretamente aos elementos HTML usando o atributo <code>style</code>.</p>
    </div>
    
</body>
</html>
